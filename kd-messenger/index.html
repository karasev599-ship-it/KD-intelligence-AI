<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08080d">
  <meta name="description" content="KD Messenger — быстрый приватный мессенджер KD.">
  <title>KD Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand-mark">KD</div>
        <div><strong>KD</strong><span>MESSENGER</span></div>
        <button class="icon-btn mobile-only" id="closeSidebar" aria-label="Закрыть">×</button>
      </div>
      <div class="me-card">
        <div class="avatar avatar-me">Д</div>
        <div class="me-copy"><b>Даниил</b><span>@kd_official</span></div>
        <i class="online-dot"></i>
      </div>
      <div class="search-box"><span>⌕</span><input id="chatSearch" placeholder="Поиск чатов"></div>
      <nav class="side-tabs" aria-label="Разделы">
        <button class="active" data-tab="chats">💬 <span>Чаты</span><em id="unreadCount">3</em></button>
        <button data-tab="calls">☎ <span>Звонки</span></button>
        <button data-tab="contacts">♙ <span>Контакты</span></button>
      </nav>
      <div class="section-label">ЧАТЫ <button id="newChat" title="Новый чат">＋</button></div>
      <div class="chat-list" id="chatList"></div>
      <div class="sidebar-bottom">
        <button class="bottom-btn" id="profileBtn">⚙ <span>Настройки</span></button>
        <button class="bottom-btn" id="themeBtn">☾ <span>Тема</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="openSidebar">☰</button>
        <div class="top-title"><span class="status-pill"></span><div><b id="headerName">KRIPTODANIK AI</b><small id="headerStatus">онлайн</small></div></div>
        <div class="top-actions"><button class="icon-btn" title="Звонок">☎</button><button class="icon-btn" title="Поиск">⌕</button><button class="icon-btn" title="Ещё">•••</button></div>
      </header>

      <section class="messages" id="messages"></section>

      <div class="typing" id="typing" hidden><span></span><span></span><span></span> печатает…</div>
      <form class="composer" id="composer">
        <button type="button" class="attach-btn" id="attach">＋</button>
        <input id="messageInput" autocomplete="off" placeholder="Сообщение…">
        <button type="button" class="emoji-btn" id="emoji">☺</button>
        <button type="submit" class="send-btn" id="send">➤</button>
      </form>
    </main>

    <aside class="info-panel" id="infoPanel">
      <div class="profile-cover"><div class="profile-avatar">KD</div></div>
      <div class="profile-info"><h2 id="infoName">KRIPTODANIK AI</h2><span id="infoHandle">@kriptodanik_ai</span><p>Трейдинг • аналитика • KD Intelligence</p></div>
      <div class="info-actions"><button>🔔<small>Уведомления</small></button><button>⌕<small>Поиск</small></button><button>⋮<small>Ещё</small></button></div>
      <div class="info-block"><label>ОПИСАНИЕ</label><p>Закрытый рабочий чат KD. Сигналы, идеи и обновления проекта.</p></div>
      <div class="info-block"><label>МЕДИА И ФАЙЛЫ</label><div class="media-grid"><div></div><div></div><div></div></div></div>
    </aside>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
