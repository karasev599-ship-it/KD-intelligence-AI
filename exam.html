<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111114"><title>Мини-экзамен — KriptoDanik AI</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0d10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:800}.counter{color:#a6a6ad;font-size:14px}.card{background:#18181d;border:1px solid #2a2a31;border-radius:22px;padding:20px;box-shadow:0 10px 35px #0007}.progress{height:6px;background:#292930;border-radius:99px;overflow:hidden;margin-bottom:22px}.bar{height:100%;width:0;background:#8b5cf6;transition:.2s}.q{font-size:20px;line-height:1.4;font-weight:700;margin-bottom:18px}.option{width:100%;padding:15px 14px;margin:7px 0;border:1px solid #34343d;background:#232329;color:#fff;border-radius:15px;text-align:left;font-size:16px;line-height:1.35}.option:active{transform:scale(.99)}.option.correct{background:#14532d;border-color:#22c55e}.option.wrong{background:#641f25;border-color:#ef4444}.next{width:100%;padding:15px;border:0;border-radius:15px;background:#8b5cf6;color:white;font-size:16px;font-weight:700;margin-top:12px}.hint{margin-top:14px;color:#aaa;font-size:14px}.result{text-align:center}.score{font-size:48px;font-weight:900;margin:15px 0}.pass{color:#4ade80}.fail{color:#fb7185}.restart{padding:15px 20px;border:0;border-radius:15px;background:#8b5cf6;color:#fff;font-weight:700;font-size:16px;width:100%}</style></head><body><div class="wrap"><div class="top"><div class="brand">🎯 Мини-экзамен</div><div class="counter" id="counter"></div></div><div class="card" id="app"></div></div><script>
const BANK=[
['Вместо жгута можно использовать',['Давящую повязку','Закрутку','Холод к ране','Шнурок'],1],
['Во время проведения работ вы увидели перед собой тело молодого мужчины, лежащего без движения. Какими будут ваши действия?',['Убедиться в собственной безопасности и только после этого подойти к человеку, громко его окрикивая','Вызвать СМП и обратиться к человеку','Отойти на безопасное расстояние и вызвать экстренные службы','Окликнуть прохожих и попросить их проверить состояние мужчины'],0],
['После успешно проведённой сердечно-лёгочной реанимации пострадавшего следует',['Оставить лежать на спине','Похлопать по щекам и дать нашатырный спирт','Громко разговаривать, пытаясь привести в сознание','Перевести в устойчивое боковое положение и контролировать состояние'],3],
['При полном нарушении проходимости верхних дыхательных путей инородным телом в первую очередь необходимо',['Очистить ротовую полость пальцами','Наклонить пострадавшего вперёд и нанести 5 резких ударов основанием ладони между лопатками','Сразу выполнить надавливания на верхнюю часть живота','Рекомендовать только откашляться и ждать скорую'],1],
['К мероприятиям по оценке обстановки и обеспечению безопасных условий относятся',['Определение угрожающих факторов собственной жизни и здоровья','Придание устойчивого бокового положения','Вызов СМП','Оценка количества пострадавших'],0],
['Оптимальным положением тела для пострадавшего с подозрением на травму грудной клетки является',['Лёжа на боку с приведёнными ногами','Полусидя с наклоном в повреждённую сторону','Лёжа на менее травмированном боку','Лёжа на спине с приподнятыми ногами'],1],
['Пальцевое прижатие подключичной артерии производится',['Над ключицей к грудине','В ямке над ключицей к первому ребру четырьмя пальцами','К ключице четырьмя пальцами','В ямке под ключицей к первому ребру четырьмя пальцами'],3],
['Соотношение надавливаний на грудную клетку и вдохов при СЛР взрослому',['4–5 к 1','15 к 2','30 к 2','5 к 1'],2],
['Открытый перелом — это',['Повреждение костной ткани с нарушением целостности кожи или слизистых в месте перелома','Повреждение мягких тканей','Полное нарушение трубчатых костей','Любое нарушение целостности костной ткани'],0],
['Сердечно-лёгочная реанимация может не проводиться, если',['Есть переломы грудины и рёбер','Есть перелом нижней челюсти','Нет возможности вызвать СМП','Имеются травмы, явно несовместимые с жизнью'],3],
['Для восстановления проходимости дыхательных путей необходимо',['Повернуть голову набок и открыть рот','Запрокинуть голову, подняв подбородок','Извлечь язык из ротовой полости','Очистить рот пальцами'],1],
['Признаком венозного кровотечения является',['Алая пульсирующая струя','Тёмная кровь, вытекающая непрерывной струёй','Кровь по капле','Кровь только с поверхности раны'],1],
['При ранениях грудной клетки необходимо',['Наложить обычную давящую повязку','Только транспортировать в больницу','Только ждать скорую','Прямое давление на рану, герметизирующая повязка и вызов СМП'],3],
['Первая помощь при травме живота с выпадением внутренних органов',['Вправить органы','Накрыть выпавшие органы влажной чистой тканью','Оставить органы открытыми','Удалить выпавшие органы'],1],
['Для чего используются стерильные марлевые бинты в аптечке первой помощи?',['Для наложения повязок','Для хранения лекарств','Для ремонта СИЗ','Для защиты от холода'],0],
['Ошибка при оказании первой помощи при термическом ожоге',['Охлаждать ожог водой','Накрыть стерильной салфеткой','Вскрывать образовавшиеся пузыри','Вызвать медицинскую помощь'],2],
['Для чего используются бескаркасные носилки в укладке первой помощи?',['Для закрытия проникающих ран','Для укрытия спасателя','Для выноса пострадавших, не способных самостоятельно передвигаться','Для переноса аптечки'],2],
['При отморожениях и воздействии низких температур необходимо',['Растирать отмороженные участки','Переместить в тёплое помещение и укрыть','Использовать горячую воду непосредственно на отморожение','Прокалывать пузыри'],1],
['Работник без сознания и дыхания после успешно проведённой СЛР: что делать?',['Оставить на спине','Перевести в устойчивое боковое положение и контролировать состояние','Дать нашатырный спирт','Посадить пострадавшего'],1],
['Что необходимо сделать перед оказанием первой помощи при обнаружении пострадавшего?',['Сразу подойти к нему независимо от обстановки','Оценить угрозу собственной жизни и здоровью','Сначала сфотографировать происшествие','Оставить место происшествия'],1]
];
let quiz=[],n=0,score=0,locked=false;function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){quiz=shuffle(BANK);n=0;score=0;render()}function render(){locked=false;document.getElementById('counter').textContent=`${n+1} / 20`;document.getElementById('app').innerHTML=`<div class="progress"><div class="bar" style="width:${n*5}%"></div></div><div class="q">${quiz[n][0]}</div>${quiz[n][1].map((x,i)=>`<button class="option" onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<div class="hint">Выбери один вариант. После ответа правильный вариант будет показан сразу.</div>`}function answer(i,el){if(locked)return;locked=true;let c=quiz[n][2],bs=[...document.querySelectorAll('.option')];if(i===c){score++;el.classList.add('correct')}else{el.classList.add('wrong');bs[c].classList.add('correct')}let b=document.createElement('button');b.className='next';b.textContent=n===19?'🏁 Показать результат':'Следующий вопрос →';b.onclick=()=>{n++;if(n>=20)result();else render()};document.getElementById('app').appendChild(b)}function result(){let pass=score>=15;document.getElementById('counter').textContent='Результат';document.getElementById('app').innerHTML=`<div class="result"><div style="font-size:42px">${pass?'🏆':'📚'}</div><h1>${pass?'Экзамен сдан!':'Нужно ещё потренироваться'}</h1><div class="score ${pass?'pass':'fail'}">${score} / 20</div><p>${pass?'Ты набрал проходные 15 правильных ответов.':'Для сдачи нужно минимум 15 правильных ответов.'}</p><button class="restart" onclick="start()">🔄 Новый рандом</button></div>`}start();</script></body></html>
